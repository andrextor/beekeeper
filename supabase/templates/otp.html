<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#fafaf7;font-family:Arial,Helvetica,sans-serif;color:#04303b">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e4e2da;border-radius:12px">
      <tr>
        <td style="padding:32px">
          <p style="margin:0 0 8px;font-size:14px;color:#0c6511;font-weight:bold">Landak Apiario</p>
          <h1 style="margin:0 0 16px;font-size:22px">Tu código de ingreso</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Escribe este código en la app para entrar. Vence en 10 minutos.</p>
          <p style="margin:0 0 24px;font-size:36px;font-weight:bold;letter-spacing:8px;text-align:center;background:#fff4e0;border-radius:8px;padding:16px">{{ .Token }}</p>
          <p style="margin:0;font-size:14px;color:#4a473f;line-height:1.5">Si no pediste este código, ignora este correo. Nadie puede entrar a tu cuenta sin él.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
