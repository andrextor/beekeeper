name: CI

# Pull requests into main that are ready for review (drafts skip), and main itself.
# A new push to the same pull request cancels the run still going for the previous one.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  db:
    if: ${{ !github.event.pull_request.draft }}
    name: Migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only what the tests touch: Postgres, Auth (auth schema), Storage (storage schema), PostgREST.
      - run: pnpm exec supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:reset
      - run: pnpm test:db
      - if: always()
        run: pnpm exec supabase stop --no-backup
