name: Release

# On every push to main: if package.json's version has no tag yet AND
# CHANGELOG.md has a "## [x.y.z]" section for it, tag the commit and publish a
# GitHub release with that section as notes. Without that section nothing
# happens, so merges only cut a release when the version is bumped on purpose.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag and changelog section
        id: check
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: v${{ steps.version.outputs.number }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
